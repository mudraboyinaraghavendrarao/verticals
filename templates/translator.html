{% include "menu_bar.html" %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    
  </head> 
  
 <body class="bg-light">  
  <div class="container">
      <h1 align="center">Translator</h1>
      <br>
         <div class="row">       
         <div class="col-sm-3">
         </div>
                  
        <div class="col-sm-6" align="center">
           <form action="/translator" method="post" align='center'>
                <!-- Enter text to translate. -->
                <div class="form-group">
                  <label ><strong>Enter the text you'd like to translate:</strong></label>
                  <textarea name="text" class="form-control" rows="5"></textarea>
                </div>
                <!-- Select output language here. -->
                <div class="form-group">
                  <label <strong>Translate to:</strong></label>
                  <select name="to_lang" class="form-control" >
                    
                    <option value="en">English</option>
                    <option value="es">Spanish</option>
                    <option value="fr">French</option>
                    <option value="de">German</option>
                    <option value="it">Italian</option>
                    <option value="hi">Hindi</option>
           
                  </select>
                </div>
                <button type="submit" class="btn btn-primary mb-2" id="translate" align="center">Translate text</button></br>
                                     
              </form>
          <!-- Translated text returned by the Translate API is rendered here. -->
        </div>
    </div>

{{trans_text}}
 </div>  
  </body>
</html>
