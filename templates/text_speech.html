<!doctype html>
<html lang="en">
<head>
    <title>SAIS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" 
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>


<br>

<div class="container">
	<section class="jumbotron text-center">
	<div class="row">
		<div class="col-sm-6">
		<h1 class="jumbotron-heading">Text to Speech</h1>
          <p class="lead text-black">
            
            <p>
         Convert text to lifelike speech for more natural interfaces.</p></p>          
		</div>

		<div class="col-sm-6">
			<div class="container">
				<form method="POST" action="/text_speech">
				<textarea name="speech" class="form-control" cols="8" rows="8"></textarea>
				<br>
				<div class="form-group">
                  <label <strong>Choose a Voice Assistant:</strong></label>
                  <select name="voices" class="form-control" >
                    
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
           
                  </select>
                </div>
				<button class="btn btn-success" type="submit">Convert</button>
			</form>
			<br>
			
			</div>
		</div>
	</div>
</section>

	<!-- form area -->
	
</div>	
</body>
</html>
