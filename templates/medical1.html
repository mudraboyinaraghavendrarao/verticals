{% include "menu_bar.html" %}
<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" 
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head> 
<body class="bg-light">
<div class="container"> 
<br>  
    <h1 align="center">{{med_title}}</h1><br>
    
    <div class="row">  
        
            <div class="col-sm-3"> <h3 align="center">{{category[0]}}</h3> </div>
            <div class="col-sm-3"> <h3 align="center">{{category[1]}}</h3> </div>
            <div class="col-sm-3"> <h3 align="center">{{category[2]}}</h3> </div>
            <div class="col-sm-3"> <h3 align="center">{{category[3]}}</h3> </div>
            
    </div>
      <br>
    <div class="row">       
            
         <div class="col-sm-3">
              {%for i in range(0,5)%} 
                 <image src="{{f_list[i]}}" width="250px" height="200px">            
              {%endfor%}       	 
         </div> 
         <div class="col-sm-3">
              {%for i in range(5,10)%} 
                 <image src="{{f_list[i]}}" width="250px" height="200px">                  
              {%endfor%}       	 
         </div> 
         <div class="col-sm-3">
              {%for i in range(10,15)%} 
                <image src="{{f_list[i]}}" width="250px" height="200px">                    
              {%endfor%}       	 
         </div> 
         <div class="col-sm-3">
              {%for i in range(15,20)%} 
                 <image src="{{f_list[i]}}" width="250px" height="200px">                 
              {%endfor%}       	 
         </div> 
         
    </div>
    
    <div class="row">  
        
            <div class="col-sm-4"> 
            </div>
            
            <div class="col-sm-4">    
                 
                <form action = "/medical2" method = "post" enctype="multipart/form-data">  
                        <h2 align='center'>
                        <input type = "submit" value="Next" class="form-control btn btn-s btn-primary"></h2>                                           
                </form>
                     
           </div>
       </div>
    
<br>

</div>
</body>
