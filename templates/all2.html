{% include "menu_bar.html" %}
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {box-sizing: border-box}

/* Set height of body and the document to 100% */
body, html {
  height: 100%;
  margin: 0;
  font-family: Arial;
}

/* Style tab links */
.tablink {
  background-color: #555;
  color: white;
  float: left;
  border: none;
  outline: none;
  cursor: pointer;
  padding: 14px 16px;
  font-size: 17px;
  width: 25%;
}

.tablink:hover {
  background-color: #777;
}

/* Style the tab content (and add height:100% for full page content) */
.tabcontent {
  color: white;
  display: none;
  padding: 100px 20px;
  height: 100%;
}

#Text {background-color: Tomato;}
#Audio {background-color: LimeGreen;}
#Image {background-color: SlateBlue;}
#Video {background-color: YellowGreen;}
</style>
</head>
<body>
<br><br><br><br><br>
<h1 align= 'center' >Text Analytics</h1>
<button class="tablink" onclick="openPage('Text', this, 'Tomato')">Text</button>
<button class="tablink" onclick="openPage('Audio', this, 'LimeGreen')">Audio</button>
<button class="tablink" onclick="openPage('Image', this, 'SlateBlue')">Image</button>
<button class="tablink" onclick="openPage('Video', this, 'YellowGreen')">Video</button>

<div id="Text" class="tabcontent">
  <h3 align='center'>Text</h3>
  <form action="/Text2" method="post" align='center'>
  <textarea name="text" rows="10" cols="30"></textarea>
  <br><br>
  <div class="col-sm-5" align='center'>
    
	<select name="Model" class='form-control'>
		<option value="1">Sentiment Analysis</option>
        <option value="2">Translator</option>
        <option value="3">Speech Convertor</option>
	</select>
	</div>
	<br><br>
  <input type="submit">
  <br><br>
</form>
</div>

<div id="Audio" class="tabcontent">
  <h3 align='center'>Audio</h3>
  <form action="/voice2" method="post" enctype="multipart/form-data" align='center'>  

	<input type="file" name="file" class='form-control' /><br>
	<br><br>
      <div class="col-sm-5">
        

    	<select name="Model" class='form-control'>
    		<option value="1">Sentiment Analysis</option>
            <option value="2">Text</option>
            
    	</select>
	  </div>
	<br><br>
    <input type = "submit" value="Upload" class="form-control btn btn-s btn-primary "> 
          
</form>
</div>

<div id="Image" class="tabcontent">
  <h3 align='center'>Image</h3>
  <form action="/Image2" method="post" enctype="multipart/form-data" align='center'>  
  
	<input type="file" name="file" class='form-control' /><br>
	<br><br>
      <div class="col-sm-5">
       

    	<select name="Model" class='form-control'>
    		<option value="1">Sentiment Analysis</option>
            <option value="2">Text</option>
            <option value="3">Speech Convertor</option>
    	</select>
	  </div>
	<br><br>
    <input type = "submit" value="Upload" class="form-control btn btn-s btn-primary "> 
          
</form>
</div>

<div id="Video" class="tabcontent">
  <h3 align='center'>Video</h3>
  <p align='center'>Coming Soon</p>
</div>

<script>
function openPage(pageName,elmnt,color) {
  var i, tabcontent, tablinks;
  tabcontent = document.getElementsByClassName("tabcontent");
  for (i = 0; i < tabcontent.length; i++) {
    tabcontent[i].style.display = "none";
  }
  tablinks = document.getElementsByClassName("tablink");
  for (i = 0; i < tablinks.length; i++) {
    tablinks[i].style.backgroundColor = "";
  }
  document.getElementById(pageName).style.display = "block";
  elmnt.style.backgroundColor = color;
}

// Get the element with id="defaultOpen" and click on it
document.getElementById("defaultOpen").click();
</script>
   
</body>
</html>
