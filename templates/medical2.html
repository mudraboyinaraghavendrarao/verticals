{% include "menu_bar.html" %}
<!doctype html>
<html lang="en">

<body class="bg-light">
<div class="container"> 
<br>

            </form>

         </div>
                  
     </div>
     <br>
     
{% if prediction %}    
<div class="row">   
       
         <div class="col-sm-4">         	 
         </div>

             <image src="{{img_path}}" width="350px" height="300px" align="center">          <br>

</div>

</div>
