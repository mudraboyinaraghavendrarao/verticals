{% include "menu_bar.html" %}
<!doctype html>
<html lang="en">
<head>
    <title>SAIS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" 
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
</head>

<body class="bg-light"> 
<div class="container"> 
<br>  
    
         <div class="row">       
             
             <div class="col-sm-6">
        		<h1 class="jumbotron-heading">Speech to Text </h1>
                  <p class="lead text-black">
                    
                    <p>
                 Transcribe audible speech into readable, searchable text.</p></p>          
        	</div>
             
             <div class="col-sm-6">
             	 <form action = "/speech_text1" method = "post" style="background:#f9f9f9 ;  padding:30px" class="text-center" enctype="multipart/form-data">  
                   <h2 align='center'</h2>
                	<input type="file" accept=".wav"  name="file" class='form-control' />
                    <input type = "submit" value="Convert Speech-to-Text" class="form-control btn btn-s btn-primary "> 
                          
                </form> 
                <p align="center">For sample file:<a href= "{{ url_for('static',filename='stt.wav') }}" download> click </a><p>
              
             </div>       
         </div>
<br>
{% if transcript %}    
<div class="row">   
       
         <div class="col-sm-3">         	 
         </div> 
         
         <div class="col-sm-6">
         <h2 align="center">Text</h2><br>
             {{transcript}}         	 
         </div>       
</div>

{% endif %} 
</div>
</body>
</html>
