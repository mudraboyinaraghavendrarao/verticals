{% include "menu_bar.html" %}
<!doctype html>
<html lang="en">
<head>
    <title>SAIS</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet">
    
    <link href="https://cdn.datatables.net/1.10.18/css/dataTables.bootstrap4.min.css" rel="stylesheet">
    
    <!-- Bootstrap core JavaScript-->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    
    <!-- Page level plugin JavaScript--><script src="https://cdn.datatables.net/1.10.18/js/jquery.dataTables.min.js"></script>
    
    <script src="https://cdn.datatables.net/1.10.18/js/dataTables.bootstrap4.min.js"></script>

</head>


<body class="bg-light"> 

<div class="container">
    <form action = "/re1" method = "post" enctype="multipart/form-data">  
        <h1 align="center">Bread Basket Recommendation</h1>
          <br>
             <div class="row">       
                 <div class="col-sm-4">
                 </div>
                 
                   <div class="col-sm-1"> 
                    	<h4><label>Item:</label></div></h4> 
                    	<div class="col-sm-3"> <select name="re_item" class='form-control'>
                    		
                            {% for mod in items_basket %}
                    			<option value="{{mod}}">{{mod}}</option>       
                    		{% endfor %}
                    	</select>
                    </div>                 
             </div>
             
             <div class="row">        
                <div class="col-sm-4"> 
                </div>
                
                <div class="col-sm-4">    
                    <h2 align='center'>
                    <input type = "submit" value="Recommendations" class="form-control btn btn-s btn-primary"></h2>     
               </div>
             </div>
    </form>
    <br><br>
            <div class="row"> 
            
                 <div class="col-sm-4"> 
                 </div>
                 <div class="col-sm-4"> 
                     {% if recom %}
                        {{recom | safe}}
                     {% endif %}
                </div>
             
    </div>
</div>

</body>
{{s}}
</html>
